name: Debug - CBS picks page probe

# Throwaway diagnostic, not part of the real pipeline. Checks whether CBS
# Sports' NFL ATS picks page hands over its pick data in the plain HTTP
# response (like ESPN's page does, via an embedded JSON blob -- see
# scripts/fetch_expert_picks.py) or whether it's built client-side by
# JavaScript after load (which would mean a lightweight urllib scraper
# can't work and we'd need a real headless browser instead). Safe to
# delete once we have the answer -- doesn't touch D1, no secrets needed.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CBS picks page and inspect raw response
        run: |
          python3 - <<'PYEOF'
          import urllib.request

          url = "https://www.cbssports.com/nfl/picks/experts/against-the-spread/1/"
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                            "(KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
          })
          with urllib.request.urlopen(req, timeout=30) as resp:
              status = resp.status
              html = resp.read().decode("utf-8", errors="replace")

          print(f"HTTP status: {status}")
          print(f"Response length: {len(html)} chars")
          print()

          markers = ["Prisco", "__NEXT_DATA__", "__INITIAL_STATE__", "against-the-spread",
                     "application/json", "-3.5", "Dubin"]
          for m in markers:
              idx = html.find(m)
              print(f"  '{m}': {'FOUND at offset ' + str(idx) if idx != -1 else 'not found'}")

          print()
          print("--- first 1000 chars of response ---")
          print(html[:1000])
          print()
          print("--- 1000 chars around first <table> tag (if any) ---")
          tidx = html.lower().find("<table")
          if tidx != -1:
              print(html[tidx:tidx + 1000])
          else:
              print("no <table> tag found in raw response")
          PYEOF
