name: Debug - CBS picks page probe

# Throwaway diagnostic, not part of the real pipeline. Round 3: dry-runs
# the real scripts/fetch_cbs_picks.py against live data -- writes the
# generated SQL to a file and prints it (via --sql-out, same convention as
# every other fetch_*.py in this repo) instead of applying it, so this is
# safe to run as many times as needed with zero risk to D1. Delete this
# workflow once fetch_cbs_picks.py is wired into odds-snapshot.yml for
# real.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pandas numpy

      - name: Refresh games.csv
        run: |
          mkdir -p raw
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o raw/games.csv \
            https://github.com/nflverse/nflverse-data/releases/download/schedules/games.csv

      - name: Dry-run fetch_cbs_picks.py (writes SQL to a file, does not apply it)
        run: |
          python3 scripts/fetch_cbs_picks.py --sql-out /tmp/cbs_picks.sql
          echo
          echo "===== generated SQL (/tmp/cbs_picks.sql) ====="
          cat /tmp/cbs_picks.sql
