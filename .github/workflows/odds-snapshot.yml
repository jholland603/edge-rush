name: Market Refresh (Odds + Model)

# Four jobs on one schedule, added together deliberately (see HANDOFF.md):
#
# 1. Snapshots live NFL moneyline/spread/total odds from The Odds API into
#    D1's odds_snapshot table, so line movement across the week is actually
#    visible (not just an open-vs-close pair). Forward-looking only -- no
#    historical backfill.
# 2. Scores upcoming games with the (rolling-10-game) prediction model and
#    upserts into D1's `model`/`picks_log` tables. This moved here from
#    weekly-refresh.yml in 2026-08 once the model stopped needing a
#    season-spanning history pull -- it now makes sense to re-score as
#    often as the odds themselves refresh, using each run's fresh market
#    line, rather than waiting for the once-a-week job.
# 3. Fetches ESPN's expert straight-up pick consensus into D1's
#    expert_consensus table (see scripts/fetch_expert_picks.py) -- also
#    forward-looking only, added 2026-08-10. Piggybacks on this same
#    schedule since experts revise picks through the week same as odds.
# 4. Fetches daily team news headlines (Google News RSS, one query per
#    team) into D1's team_news table (see scripts/fetch_team_news.py) --
#    added 2026-08-12, Jeff's ask for upcoming-game news coverage per team.
#    Runs only on the once-a-day morning slot (gated below), not every one
#    of this workflow's 16 weekly triggers -- news doesn't need to refresh
#    on every odds/kickoff check, and Google News RSS has no documented
#    rate-limit tolerance worth testing needlessly.
#
# Filename stayed odds-snapshot.yml (just the display name above changed) to
# avoid re-creating the workflow and losing run history over a rename.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   ODDS_API_KEY           - from https://the-odds-api.com (free tier is
#                             plenty: this uses ~3 credits per run)
#   CLOUDFLARE_API_TOKEN   - same one weekly-refresh.yml uses
#   CLOUDFLARE_ACCOUNT_ID  - same one weekly-refresh.yml uses

on:
  schedule:
    # All times computed assuming ET = UTC-4 (EDT). NFL season straddles
    # the Nov DST change, so once EST (UTC-5) kicks in these all fire an
    # hour earlier than the local-time label below -- e.g. "1hr before a
    # 1pm kickoff" becomes 2hrs before once EST starts. That's the safe
    # direction (early, never late), so left as-is rather than juggling
    # two sets of cron entries for one DST swap mid-season.
    #
    # Morning refresh, every day, 8am ET -> 12:00 UTC (16 calls/week total,
    # confirmed with Jeff): 7/week from this entry alone.
    - cron: "0 12 * * *"
    # Evening refresh, non-game days only (Tue/Wed/Fri/Sat), 8pm ET -> next
    # day 00:00 UTC. Cron day-of-week is the UTC day, so this list is the
    # day AFTER each local evening: Wed(3)=Tue evening, Thu(4)=Wed evening,
    # Sat(6)=Fri evening, Sun(0)=Sat evening. 4/week.
    - cron: "0 0 * * 0,3,4,6"
    # Pre-kickoff, Thursday Night Football (~8:15pm ET), refresh ~7pm ET
    # -> 23:00 UTC same day. 1/week.
    - cron: "0 23 * * 4"
    # Pre-kickoff, Sunday's three kickoff windows (1:00pm, ~4:15pm, 8:20pm
    # ET) -> 16:00 / 19:00 / 23:00 UTC, one call per window covers every
    # game in that window at once. 3/week.
    - cron: "0 16,19,23 * * 0"
    # Pre-kickoff, Monday Night Football (~8:15pm ET) -> 23:00 UTC. 1/week.
    - cron: "0 23 * * 1"
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pandas numpy

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Determine current NFL season
        id: season
        run: |
          SEASON=$(python3 -c "
          from datetime import date
          today = date.today()
          print(today.year - 1 if today.month in (1, 2) else today.year)
          ")
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "Current season: $SEASON"

      - name: Refresh games.csv (need current upcoming-game_ids to match odds against)
        # --retry/--retry-all-errors added 2026-08-12: this step started
        # intermittently hitting "curl: (56) Connection died, tried 5 times
        # before giving up" against nflverse-data's GitHub release CDN,
        # failing the whole job before any later step (including team_news)
        # ever ran. --retry-all-errors needs curl >= 7.71 (ubuntu-latest has
        # a newer curl than that as of this writing).
        run: |
          mkdir -p raw
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o raw/games.csv \
            https://github.com/nflverse/nflverse-data/releases/download/schedules/games.csv

      - name: Check whether anything's actually coming up
        id: gamecheck
        # This schedule runs year-round (16x/week during the season adds
        # up fast, but cron doesn't know it's July). Skip the paid API
        # call entirely -- this check is free, just reads the CSV already
        # on disk -- if nothing's scheduled in the next 60 days.
        #
        # Was a 3-day window originally, on the theory that odds are only
        # worth capturing right before kickoff. Wrong: sportsbooks post
        # spreads/totals for the whole upcoming week (and often further
        # out -- Week 1 lines are live over a month before the season
        # opens) long before the 3-day mark, and Phase 3 of this project
        # (closing-line-value tracking) needs the *opening* line, not just
        # the last few days of movement. A 3-day gate meant real snapshot
        # collection couldn't start until ~3 days before Week 1 every
        # year, throwing away over a month of legitimate movement data.
        # 60 days still closes the gate during the true dead offseason
        # (Super Bowl in Feb to ~mid-July, when games.csv has nothing
        # upcoming within 60 days) while opening it back up for all of
        # preseason and the actual season. Credit budget was never the
        # real constraint here -- even running every scheduled slot
        # year-round stays well under the free tier's 500/month.
        run: |
          python3 -c "
          import pandas as pd
          from datetime import date, timedelta
          df = pd.read_csv('raw/games.csv', low_memory=False)
          upcoming = df[df['result'].isna()].copy()
          upcoming['gameday'] = pd.to_datetime(upcoming['gameday'])
          window = upcoming[
              (upcoming['gameday'] >= pd.Timestamp(date.today() - timedelta(days=1)))
              & (upcoming['gameday'] <= pd.Timestamp(date.today() + timedelta(days=60)))
          ]
          print(f'{len(window)} upcoming game(s) in the next 60 days')
          print('has_games=' + ('true' if len(window) > 0 else 'false'))
          " | tee /tmp/gamecheck.log
          tail -1 /tmp/gamecheck.log >> "$GITHUB_OUTPUT"

      - name: Fetch odds snapshot and apply to D1
        if: steps.gamecheck.outputs.has_games == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 scripts/fetch_odds_snapshot.py --sql-out /tmp/odds.sql
          if [ -s /tmp/odds.sql ]; then
            wrangler d1 execute edge-rush --remote --file=/tmp/odds.sql
          else
            echo "No odds rows to insert this run."
          fi

      - name: Fetch ESPN expert picks and apply to D1
        if: steps.gamecheck.outputs.has_games == 'true'
        # continue-on-error added 2026-08-12: this step just failed hard
        # ("Could not find window['__espnfitt__']" -- either ESPN's page
        # markup changed, or picks simply aren't posted yet for a week this
        # far out), which killed the whole job before odds/team-news/model
        # steps below it ever ran. One third-party page's markup shouldn't
        # be able to take down the rest of the pipeline -- same reasoning
        # as the "unmatched"/"not published yet" skips already used
        # elsewhere in this workflow. Revisit fetch_expert_picks.py's page
        # parsing separately if this keeps failing.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 scripts/fetch_expert_picks.py --sql-out /tmp/expert_picks.sql
          if [ -s /tmp/expert_picks.sql ]; then
            wrangler d1 execute edge-rush --remote --file=/tmp/expert_picks.sql
          else
            echo "No expert picks to insert this run (not posted yet, or none matched)."
          fi

      - name: Fetch team news headlines and apply to D1
        # Only on the once-a-day morning slot (0 12 * * *) or a manual run --
        # see job header comment for why this doesn't need every trigger.
        if: github.event.schedule == '0 12 * * *' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 scripts/fetch_team_news.py --sql-out /tmp/team_news.sql
          if [ -s /tmp/team_news.sql ]; then
            wrangler d1 execute edge-rush --remote --file=/tmp/team_news.sql
          else
            echo "No team news headlines fetched this run."
          fi

      - name: Download recent team stats + injuries (rolling-10 only needs last ~1-2 seasons)
        run: |
          SEASON=${{ steps.season.outputs.season }}
          mkdir -p raw/team raw/injuries
          for s in $((SEASON - 1)) "$SEASON"; do
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "raw/team/stats_team_week_${s}.csv" \
              "https://github.com/nflverse/nflverse-data/releases/download/stats_team/stats_team_week_${s}.csv" \
              || echo "  team stats $s: not published/available, skipping"
          done
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "raw/injuries/injuries_${SEASON}.csv" \
            "https://github.com/nflverse/nflverse-data/releases/download/injuries/injuries_${SEASON}.csv" \
            || echo "  injuries $SEASON: not published yet, skipping"

      - name: Score upcoming games and apply to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SEASON=${{ steps.season.outputs.season }}
          python3 scripts/weekly_update.py --season "$SEASON" --sql-out /tmp/model_update.sql
          if [ -s /tmp/model_update.sql ]; then
            wrangler d1 execute edge-rush --remote --file=/tmp/model_update.sql
          else
            echo "No model updates this run (no upcoming games with posted lines)."
          fi
