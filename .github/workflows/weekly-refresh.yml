name: Weekly Data Refresh

# Replaces the Cowork scheduled task "edge-rush-weekly-refresh". Handles the
# stuff that only actually changes about once a week: pulling fresh
# team/player/injury CSVs into D1, and grading picks whose games have since
# been played. Model scoring moved OUT of this workflow in 2026-08 (see
# market-refresh.yml) once the model switched to a rolling-10-game rating --
# it now needs to run on the same cadence as the odds snapshots, not just
# Tuesdays, and specifically does NOT need the season-spanning CSV pull this
# workflow used to do only for that step's sake. See HANDOFF.md.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - scoped to D1 edit access for the edge-rush DB
#   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account that owns the DB

on:
  schedule:
    # 9:09am US Eastern on Tuesdays. GitHub Actions cron is always UTC and
    # does not shift for daylight saving, so this drifts an hour during
    # EST (Nov-Mar) -- close enough for a weekly data refresh; adjust if
    # exact timing ever matters.
    - cron: "9 13 * * 2"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pandas numpy

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Determine current NFL season
        id: season
        run: |
          SEASON=$(python3 -c "
          from datetime import date
          today = date.today()
          print(today.year - 1 if today.month in (1, 2) else today.year)
          ")
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "Current season: $SEASON"

      - name: Download fresh nflverse CSVs
        # --retry/--retry-all-errors added 2026-08-12: nflverse-data's
        # GitHub release CDN has been intermittently dropping connections
        # mid-download ("curl: (56) Connection died"), which failed
        # market-refresh.yml's games.csv step outright (no fallback there)
        # several days running. Added here too for the same reason even
        # though these season-specific pulls already tolerate failure via
        # `|| echo` -- without retries, a transient network blip looks
        # identical to "not published yet" and silently skips real data.
        run: |
          SEASON=${{ steps.season.outputs.season }}
          mkdir -p raw/team raw/player raw/injuries

          echo "games.csv (all seasons, always refreshed)..."
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o raw/games.csv \
            https://github.com/nflverse/nflverse-data/releases/download/schedules/games.csv

          # build_incremental_sql.py only ever loads ONE season into D1 at a
          # time (historical seasons were bulk-loaded once already, see
          # HANDOFF.md) -- current season's team stats is all this workflow
          # needs. No more looping back to 1999: that was only ever for the
          # old EWMA model's full-history rating, which market-refresh.yml's
          # rolling-10 model doesn't need.
          echo "current-season team stats..."
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "raw/team/stats_team_week_${SEASON}.csv" \
            "https://github.com/nflverse/nflverse-data/releases/download/stats_team/stats_team_week_${SEASON}.csv" \
            || echo "  team stats $SEASON: not published yet, skipping"

          echo "current-season player stats + injuries..."
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "raw/player/stats_player_week_${SEASON}.csv" \
            "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_${SEASON}.csv" \
            || echo "  player stats $SEASON: not published yet, skipping"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "raw/injuries/injuries_${SEASON}.csv" \
            "https://github.com/nflverse/nflverse-data/releases/download/injuries/injuries_${SEASON}.csv" \
            || echo "  injuries $SEASON: not published yet, skipping"

      - name: Load new/updated raw data into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SEASON=${{ steps.season.outputs.season }}
          python3 scripts/build_incremental_sql.py --season "$SEASON" --sql-out /tmp/incremental.sql
          if [ -s /tmp/incremental.sql ]; then
            wrangler d1 execute edge-rush --remote --file=/tmp/incremental.sql
          else
            echo "No incremental changes this run."
          fi

      - name: Reconcile pending picks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 execute edge-rush --remote --json \
            --command "SELECT game_id, market_spread, model_spread FROM picks_log WHERE actual_result IS NULL;" \
            > /tmp/pending_raw.json
          python3 -c "
          import json
          rows = json.load(open('/tmp/pending_raw.json'))[0]['results']
          json.dump(rows, open('/tmp/pending.json', 'w'))
          print(f'{len(rows)} pending pick(s) to check')
          "
          python3 scripts/reconcile_picks.py --pending-json /tmp/pending.json --sql-out /tmp/reconcile.sql
          if [ -s /tmp/reconcile.sql ]; then
            wrangler d1 execute edge-rush --remote --file=/tmp/reconcile.sql
          else
            echo "Nothing to reconcile this run."
          fi
