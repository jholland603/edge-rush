<!DOCTYPE html>

<body>

<site-header active="players"></site-header>

<main>
  <div class="page-header">
    <h1>Player stats</h1>
    <p>Search any player tracked since 1999 for career totals and season-by-season weekly logs.
      <a href="compare.html">Compare multiple players &rarr;</a>

  </div>

  <div class="controls">
    <div class="control player-search-results" style="flex:1; min-width:260px;">

      <input type="search" id="player-search" placeholder="Start typing a name&hellip;" autocomplete="off">
      <div id="search-results"></div>
    </div>
  </div>

  <div id="player-detail">
    <div class="empty-state">Search for a player above to see their stats.</div>
  </div>

<site-footer></site-footer>
