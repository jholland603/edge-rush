<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edge Rush &mdash; Compare Players</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<site-header active="compare"></site-header>

<main>
  <div class="page-header">
    <p><a href="players.html">&larr; Back to players</a></p>
    <h1>Compare players</h1>
    <p>Search and add 2 or more players to see their career totals side by side. Mixed positions are fine &mdash; each player's own stat columns just fill in, everyone else shows a dash.</p>
  </div>

  <div class="controls">
    <div class="control player-search-results" style="flex:1; min-width:260px;">
      <label for="player-search">Add a player</label>
      <input type="search" id="player-search" placeholder="Start typing a name&hellip;" autocomplete="off">
      <div id="search-results"></div>
    </div>
    <div class="control">
      <label for="year-from">From season</label>
      <select id="year-from"></select>
    </div>
    <div class="control">
      <label for="year-to">To season</label>
      <select id="year-to"></select>
    </div>
    <div class="control">
      <label for="season-type-select">Season type</label>
      <select id="season-type-select">
        <option value="reg">Regular season only</option>
        <option value="post">Playoffs only</option>
        <option value="all">Regular season + playoffs</option>
      </select>
    </div>
  </div>

  <div id="chip-row" class="chip-row"></div>

  <div class="table-wrap" id="compare-table-wrap">
    <div class="empty-state">Add at least 2 players to compare.</div>
  </div>
</main>

<site-footer></site-footer>

<script src="assets/js/components.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/player-stats.js"></script>
<script src="assets/js/page-compare.js"></script>
</body>
</html>
