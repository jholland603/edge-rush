<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edge Rush &mdash; Game</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<site-header active="games"></site-header>

<main>
  <div class="page-header">
    <p><a href="games.html">&larr; Back to schedule</a></p>
    <h1 id="game-title">Loading&hellip;</h1>
    <p id="game-subtitle"></p>
  </div>

  <div id="game-summary-wrap"></div>

  <div id="model-wrap"></div>

  <details class="page-section" open>
    <summary><h2>Team comparison</h2></summary>
    <div class="view-toggle" id="compare-toggle">
      <button type="button" data-view="recent" class="active">Last 10</button>
      <button type="button" data-view="full_season">Full season</button>
    </div>
    <div id="compare-table-wrap">
      <div class="loading">Loading&hellip;</div>
    </div>
  </details>

  <details class="page-section" open>
    <summary><h2>Situational signals</h2></summary>
    <div class="signals-grid" id="signals-wrap"></div>
  </details>

  <details class="page-section">
    <summary><h2>Odds movement</h2></summary>
    <div class="table-wrap" id="odds-table-wrap">
      <div class="loading">Loading&hellip;</div>
    </div>
  </details>

  <details class="page-section">
    <summary><h2>Head-to-head history</h2></summary>
    <div class="table-wrap" id="h2h-table-wrap">
      <div class="loading">Loading&hellip;</div>
    </div>
  </details>
</main>

<site-footer></site-footer>

<script src="assets/js/components.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/page-game.js"></script>
</body>
</html>
