<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edge Rush &mdash; Games</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<site-header active="games"></site-header>

<main>
  <div class="page-header">
    <h1>Games &amp; schedule</h1>
  </div>

  <div class="controls">
    <div class="control">
      <label for="season-select">Season</label>
      <select id="season-select"></select>
    </div>
    <div class="control">
      <label for="week-select">Week</label>
      <select id="week-select"></select>
    </div>
    <div class="control" style="flex:1; min-width:180px;">
      <label for="team-filter">Team (optional)</label>
      <input type="text" id="team-filter" placeholder="e.g. KC" maxlength="3" style="text-transform:uppercase;">
    </div>
  </div>

  <p class="text-faint" id="leans-note" style="display:none; margin: 0 0 var(--space-3);">
    Signals/Stats columns need a specific week selected (they're too expensive to compute for every game in a season at once).
  </p>

  <div class="table-wrap" id="games-table-wrap">
    <div class="loading">Loading&hellip;</div>
  </div>
</main>

<site-footer></site-footer>

<script src="assets/js/components.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/page-games.js"></script>
</body>
</html>
